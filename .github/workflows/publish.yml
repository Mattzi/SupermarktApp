# Baut das Image für den k3s-Cluster und legt es unter ghcr.io/mattzi/supermarktapp:<commit> ab.
# Der Cluster zieht das Image per Commit-SHA; das infra-Repo pinnt den Tag
# (components/supermarktapp/kustomization.yaml), ein Push ändert also nichts von selbst.
name: publish

on:
  push:
    branches: [hetzner, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Bei der GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/mattzi/supermarktapp:${{ github.sha }}
            ghcr.io/mattzi/supermarktapp:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
